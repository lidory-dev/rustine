[package]
name = "rustine-uniffi-bindgen"
version = "1.0.0"
edition = "2021"
authors = ["Rustine Contributors"]
description = "A UniFFI Kotlin Multiplatform bindings generator for Rust"
documentation = "https://github.com/lidory-dev/rustine"
homepage = "https://github.com/lidory-dev/rustine"
repository = "https://github.com/lidory-dev/rustine"
readme = "../../README.md"
license = "MPL-2.0"
keywords = ["ffi", "bindgen", "kotlin"]

[dependencies]
anyhow = { workspace = true }
askama = { workspace = true, default-features = false, features = [
    "config",
    "derive",
    "alloc",
] }
camino = { workspace = true }
clap = { workspace = true, features = ["derive", "cargo", "std"] }
fs-err = "2.11.0"
heck = "0.5.0"
serde = "1.0.203"
textwrap = "0.16.1"
# Must resolve to the same version as uniffi_bindgen, whose API exposes toml types.
toml = ">=0.9, <2"
uniffi_bindgen = { workspace = true }
uniffi_meta = { workspace = true }
