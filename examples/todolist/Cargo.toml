[package]
name = "rustine-example-todolist"
version = "0.1.0"
edition = "2021"
publish = false
# Cargo walks all files of a package with a build script to fingerprint it, Gradle's build
# directory included, which races with Gradle writing there and slows Cargo down. Only list
# the files Cargo needs.
include = ["/src", "/build.rs", "/Cargo.toml", "/uniffi.toml"]

[lib]
name = "rustine_example_todolist"
crate-type = ["cdylib", "staticlib"]
path = "src/commonMain/rust/lib.rs"

[dependencies]
uniffi = { workspace = true }
once_cell = { workspace = true }
thiserror = { workspace = true }

[build-dependencies]
uniffi = { workspace = true, features = ["build"] }
