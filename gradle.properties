# Gradle
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

# Kotlin
kotlin.code.style=official
kotlin.native.ignoreDisabledTargets=true
kotlin.mpp.enableCInteropCommonization=true

# Rustine
rustine.projects.gradleTests=true
rustine.projects.uniffiTests=true
rustine.projects.uniffiTests.extTypes=true
rustine.projects.uniffiTests.futures=true
rustine.projects.examples.app=true
rustine.projects.examples.audioCppApp=true
rustine.projects.examples.customTypes=true
rustine.projects.examples.tokioBlake3App=true
rustine.projects.examples.tokioBoringApp=true