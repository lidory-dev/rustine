[package]
name = "rustine-fixture-gradle-cargo-only"
version = "0.1.0"
edition = "2021"
publish = false
# Cargo walks all files of a package with a build script to fingerprint it, Gradle's build
# directory included, which races with Gradle writing there and slows Cargo down. Only list
# the files Cargo needs.
include = ["/src", "/build.rs", "/Cargo.toml"]

[lib]
name = "rustine_fixture_gradle_cargo_only"
crate-type = ["cdylib", "staticlib"]
path = "src/commonMain/rust/lib.rs"

[dependencies]
jni = "0.21"

[build-dependencies]
cbindgen = "0.26.0"

[features]
feature1 = []
feature2 = []
feature3 = []
feature4 = []
feature5 = []
feature6 = []
feature7 = []
