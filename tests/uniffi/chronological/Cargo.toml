[package]
name = "rustine-fixture-chronological"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "rustine_fixture_chronological"
crate-type = ["cdylib", "staticlib"]
path = "src/commonMain/rust/lib.rs"

[dependencies]
uniffi = { workspace = true }
thiserror = { workspace = true }
chrono = { version = "0.4.23", default-features = false, features = [
    "alloc",
    "std",
] }

[build-dependencies]
rustine-fixture-build-common = { path = "../../build-common" }
