[package]
name = "rustine-fixture-dynamic-library-dependencies"
version = "0.1.0"
edition = "2021"
publish = false
# Cargo walks all files of a package with a build script to fingerprint it, Gradle's build
# directory included, which races with Gradle writing there and slows Cargo down. Only list
# the files Cargo needs.
include = ["/src", "/build.rs", "/Cargo.toml", "/uniffi.toml"]

[lib]
name = "rustine_fixture_dynamic_library_dependencies"
crate-type = ["staticlib", "cdylib"]
path = "src/commonMain/rust/lib.rs"

[dependencies]
uniffi = { workspace = true }

[build-dependencies]
rustine-fixture-build-common = { path = "../../build-common" }

[target.'cfg(all(target_os = "windows", target_env = "msvc"))'.build-dependencies]
tempdir = "0.3"

[features]
static = []
