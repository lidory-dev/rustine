[package]
name = "rustine-fixture-ext-types-uniffi-one"
version = "0.1.0"
edition = "2021"
publish = false
# Cargo walks all files of a package with a build script to fingerprint it, Gradle's build
# directory included, which races with Gradle writing there and slows Cargo down. Only list
# the files Cargo needs.
include = ["/src", "/build.rs", "/Cargo.toml", "/uniffi.toml"]

[lib]
# The name of this library is `uniffi_one` in upstream. Add the kmm_ prefix here
# to prevent potential name conflict when UniFFI tries to find the target by
# its name.
name = "kmm_uniffi_one"
crate-type = ["lib", "cdylib", "staticlib"]
path = "src/commonMain/rust/lib.rs"

[dependencies]
thiserror = { workspace = true }
uniffi = { workspace = true }

[build-dependencies]
rustine-fixture-build-common = { path = "../../../build-common" }
