[package]
name = "rustine-fixture-ext-types-custom-types"
version = "0.1.0"
edition = "2021"
publish = false
# Cargo walks all files of a package with a build script to fingerprint it, Gradle's build
# directory included, which races with Gradle writing there and slows Cargo down. Only list
# the files Cargo needs.
include = ["/src", "/build.rs", "/Cargo.toml", "/uniffi.toml"]

[lib]
# The name of this library is `ext_types_custom` in upstream. Add the kmm_
# prefix here to prevent potential name conflict when UniFFI tries to find the
# target by its name.
name = "kmm_ext_types_custom"
crate-type = ["lib", "cdylib", "staticlib"]
path = "src/commonMain/rust/lib.rs"

[dependencies]
uniffi = { workspace = true }
thiserror = { workspace = true }

[build-dependencies]
rustine-fixture-build-common = { path = "../../../build-common" }
