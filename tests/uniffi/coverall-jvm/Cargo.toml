[package]
name = "rustine-fixture-coverall-jvm"
version = "0.1.0"
edition = "2021"
publish = false
# Cargo walks all files of a package with a build script to fingerprint it, Gradle's build
# directory included, which races with Gradle writing there and slows Cargo down. Only list
# the files Cargo needs.
include = ["/src", "/build.rs", "/Cargo.toml"]

[lib]
name = "rustine_fixture_coverall_jvm"
crate-type = ["cdylib"]
path = "src/main/rust/lib.rs"

[dependencies]
uniffi = { workspace = true }
once_cell = { workspace = true }
thiserror = { workspace = true }

[build-dependencies]
rustine-fixture-build-common = { path = "../../build-common" }
