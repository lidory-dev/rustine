[package]
name = "rustine-fixture-error-types"
version = "0.1.0"
edition = "2021"
publish = false
# Cargo walks all files of a package with a build script to fingerprint it, Gradle's build
# directory included, which races with Gradle writing there and slows Cargo down. Only list
# the files Cargo needs.
include = ["/src", "/build.rs", "/Cargo.toml", "/uniffi.toml"]

[lib]
name = "rustine_fixture_error_types"
crate-type = ["cdylib", "staticlib"]
path = "src/commonMain/rust/lib.rs"

[dependencies]
anyhow = { workspace = true }
uniffi = { workspace = true }
thiserror = { workspace = true }

[build-dependencies]
rustine-fixture-build-common = { path = "../../build-common" }
