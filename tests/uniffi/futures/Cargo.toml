[package]
name = "rustine-fixture-futures"
version = "0.21.0"
authors = ["Ivan Enderlin <ivan@mnt.io>"]
edition = "2021"
license = "MPL-2.0"
publish = false
# Cargo walks all files of a package with a build script to fingerprint it, Gradle's build
# directory included, which races with Gradle writing there and slows Cargo down. Only list
# the files Cargo needs.
include = ["/src", "/build.rs", "/Cargo.toml", "/uniffi.toml"]

[lib]
name = "rustine_fixture_futures"
crate-type = ["cdylib", "staticlib"]
path = "src/commonMain/rust/lib.rs"

[dependencies]
async-trait = "0.1"
futures = "0.3"
# Add the "scaffolding-ffi-buffer-fns" feature to make sure things can build correctly
uniffi = { workspace = true, features = [
    "tokio",
    "scaffolding-ffi-buffer-fns",
] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time", "sync"] }
once_cell = { workspace = true }

[build-dependencies]
rustine-fixture-build-common = { path = "../../build-common", features = [
    "scaffolding-ffi-buffer-fns",
] }
