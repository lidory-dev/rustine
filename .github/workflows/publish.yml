name: Publish Rustine to Maven Central and crates.io

on:
  release:
    types: [ created ]

jobs:
  build-image:
    name: Build Docker image containing required dependencies
    uses: ./.github/workflows/dependency-image.yml
    secrets: inherit
    with:
      trigger-event: ${{ github.event_name }}
  publish:
    name: Publish Rustine to Maven Central and crates.io
    timeout-minutes: 120
    runs-on: ubuntu-latest
    needs: build-image
    strategy:
      matrix:
        publish-name:
          - gradle-plugins
          - cargo-packages
    steps:
      - uses: actions/checkout@v4
      - name: Enable Docker CLI experimental features
        run: echo "DOCKER_CLI_EXPERIMENTAL=enabled" >> $GITHUB_ENV
      - name: Docker login to GitHub Container Registry
        run: docker login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
      - name: Publish Rustine
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}":/home/pr-build-test/workspace \
            -w /home/pr-build-test/workspace \
            -e RUSTINE_CRATES_IO_API_TOKEN="${RUSTINE_CRATES_IO_API_TOKEN}" \
            -e ORG_GRADLE_PROJECT_mavenCentralUsername="${RUSTINE_MAVEN_CENTRAL_USERNAME}" \
            -e ORG_GRADLE_PROJECT_mavenCentralPassword="${RUSTINE_MAVEN_CENTRAL_PASSWORD}" \
            -e ORG_GRADLE_PROJECT_signingInMemoryKey="${RUSTINE_MAVEN_CENTRAL_SIGNING_KEY}" \
            -e ORG_GRADLE_PROJECT_signingInMemoryKeyId="${RUSTINE_MAVEN_CENTRAL_SIGNING_KEY_ID}" \
            -e ORG_GRADLE_PROJECT_signingInMemoryKeyPassword="${RUSTINE_MAVEN_CENTRAL_SIGNING_PASSWORD}" \
            ${{ needs.build-image.outputs.build-image }} \
            /usr/bin/pwsh -c ./.github/workflows/publish/${{ matrix.publish-name }}.ps1
        env:
          RUSTINE_CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
          RUSTINE_MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          RUSTINE_MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          RUSTINE_MAVEN_CENTRAL_SIGNING_KEY: ${{ secrets.MAVEN_CENTRAL_SIGNING_KEY }}
          RUSTINE_MAVEN_CENTRAL_SIGNING_KEY_ID: ${{ secrets.MAVEN_CENTRAL_SIGNING_KEY_ID }}
          RUSTINE_MAVEN_CENTRAL_SIGNING_PASSWORD: ${{ secrets.MAVEN_CENTRAL_SIGNING_PASSWORD }}